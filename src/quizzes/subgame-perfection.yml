title: Subgame perfection
pick: 5
questions:
  - q: "A subgame perfect equilibrium is a Nash equilibrium that ..."
    options:
      - text: "induces a Nash equilibrium in every subgame, including unreached ones"
        correct: true
      - text: "maximises the sum of the players' payoffs"
      - text: "uses only pure strategies"
      - text: "reaches the last node of the tree"
    explain: "Subgame perfection requires optimal play in every subgame, not just on the path."

  - q: "Backward induction solves a perfect-information game by ..."
    options:
      - text: "working from the final decisions back to the root, choosing optimally at each node"
        correct: true
      - text: "trying every strategy profile at random"
      - text: "converting it to a zero sum game"
      - text: "ignoring the players' payoffs"
    explain: "It removes dominated choices from the back of the tree forwards to the start."

  - q: "A non-credible threat is one that ..."
    options:
      - text: "the threatening player would not actually want to carry out if the subgame were reached"
        correct: true
      - text: "is written down before the game begins"
      - text: "always leads to the highest payoff"
      - text: "both players agree to"
    explain: "Subgame perfection rules out equilibria that rely on such threats off the path."

  - q: "Which is true of Nash equilibria versus subgame perfect equilibria?"
    options:
      - text: "every subgame perfect equilibrium is a Nash equilibrium, but not conversely"
        correct: true
      - text: "every Nash equilibrium is subgame perfect"
      - text: "they are always the same"
      - text: "subgame perfect equilibria need not be Nash equilibria"
    explain: "Subgame perfection is a refinement: it is a stricter requirement than Nash."

  - q: "Every finite game of perfect information has ..."
    options:
      - text: "a Nash equilibrium in pure strategies, found by backward induction"
        correct: true
      - text: "no Nash equilibrium"
      - text: "a unique mixed equilibrium only"
      - text: "exactly two equilibria"
    explain: "Backward induction always produces such an equilibrium, which is moreover subgame perfect."

  - q: "In the centipede game, backward induction predicts that ..."
    options:
      - text: "the first player takes immediately, even though both could do better by passing"
        correct: true
      - text: "both players pass to the final leaf"
      - text: "the players alternate forever"
      - text: "there is no subgame perfect equilibrium"
    explain: "Cooperation unravels from the last node, so the predicted outcome is to stop at once."

  - q: "A node initiates a subgame when ..."
    options:
      - text: "it and all of its successors form a self-contained part of the tree"
        correct: true
      - text: "it is the root of the whole game"
      - text: "it is a terminal node"
      - text: "both players move there at once"
    explain: "A subgame is a node together with everything that follows it, cutting no information set."

  - q: "In a game of perfect information, every information set ..."
    options:
      - text: "contains a single node"
        correct: true
      - text: "contains every node of the tree"
      - text: "is empty"
      - text: "belongs to both players"
    explain: "Perfect information means each player always knows exactly where they are."

  - q: "A strategy in an extensive form game specifies ..."
    options:
      - text: "an action at every decision node of the player"
        correct: true
      - text: "only the first move"
      - text: "a single action for the whole game"
      - text: "the opponent's moves"
    explain: "A strategy is a complete contingent plan, one action per decision node."

  - q: "Subgame perfection rules out equilibria that rely on ..."
    options:
      - text: "non-credible threats off the path of play"
        correct: true
      - text: "mixed strategies"
      - text: "backward induction"
      - text: "cooperation"
    explain: "It requires optimal play in every subgame, so threats must be credible."

  - q: "Backward induction at a decision node chooses the action that ..."
    options:
      - text: "maximises that player's payoff given the optimal play that follows"
        correct: true
      - text: "maximises the other player's payoff"
      - text: "is chosen at random"
      - text: "minimises the total payoff"
    explain: "Each player plays a best response to the already-solved continuation."

  - q: "If player 2 has a binary choice after each of player 1's two moves, player 2 has ..."
    options:
      - text: "four contingent strategies"
        correct: true
      - text: "two strategies"
      - text: "one strategy"
      - text: "eight strategies"
    explain: "A strategy specifies a choice after L and after R, giving \\(2 \\times 2 = 4\\)."

  - q: "Every subgame perfect equilibrium is ..."
    options:
      - text: "a Nash equilibrium"
        correct: true
      - text: "in mixed strategies"
      - text: "unique"
      - text: "Pareto efficient"
    explain: "Subgame perfection is a refinement of Nash equilibrium."

  - q: "Sequential rationality requires that a player's strategy is optimal ..."
    options:
      - text: "at every information set, whether or not it is reached"
        correct: true
      - text: "only on the equilibrium path"
      - text: "only at the first move"
      - text: "only when the player is winning"
    explain: "Optimality must hold conditional on every decision point."

  - q: "In games of perfect information, the equilibrium found by backward induction is ..."
    options:
      - text: "subgame perfect"
        correct: true
      - text: "never a Nash equilibrium"
      - text: "always mixed"
      - text: "the worst outcome for both players"
    explain: "Backward induction produces a subgame perfect equilibrium."

  - q: "An extensive form game has perfect information when ..."
    options:
      - text: "every information set contains a single node"
        correct: true
      - text: "every player has the same payoff"
      - text: "players move simultaneously"
      - text: "there are no chance moves"
    explain: "With singleton information sets, every node initiates a subgame and backward induction applies."

  - q: "Backward induction proceeds by removing, at each decision node, actions that are ..."
    options:
      - text: "dominated for the player deciding there"
        correct: true
      - text: "chosen by chance"
      - text: "played first"
      - text: "on the equilibrium path"
    explain: "Working from the final nodes back to the root, dominated actions are pruned to leave the equilibrium."

  - q: "A subgame perfect equilibrium must induce a Nash equilibrium in ..."
    options:
      - text: "every subgame, including those never reached in play"
        correct: true
      - text: "only the subgames on the equilibrium path"
      - text: "only the whole game"
      - text: "only the final subgame"
    explain: "This is exactly what rules out non-credible threats sitting off the equilibrium path."

  - q: "The requirement that a strategy be optimal at every information set where a player decides is called ..."
    options:
      - text: "sequential rationality"
        correct: true
      - text: "Pareto efficiency"
      - text: "the folk theorem"
      - text: "additivity"
    explain: "Sequential rationality is the principle behind backward induction and subgame perfection."

  - q: "In every finite game of perfect information, backward induction produces ..."
    options:
      - text: "a pure-strategy subgame perfect Nash equilibrium"
        correct: true
      - text: "a mixed equilibrium only"
      - text: "no equilibrium in general"
      - text: "a non-credible threat"
    explain: "Such games always have a pure-strategy Nash equilibrium, and backward induction identifies one."
