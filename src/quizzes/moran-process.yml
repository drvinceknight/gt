title: Moran process
pick: 5
questions:
  - q: "At each step of a Moran process ..."
    options:
      - text: "one individual reproduces (proportional to fitness) and one is chosen uniformly to die"
        correct: true
      - text: "every individual reproduces once"
      - text: "the least fit individual always dies"
      - text: "the population size grows by one"
    explain: "Selection by fitness for birth, uniform choice for death, keeps the population size fixed."

  - q: "The fixation probability of a type is ..."
    options:
      - text: "the probability the population eventually consists entirely of that type"
        correct: true
      - text: "the probability the type dies out"
      - text: "the fraction of the population it starts with"
      - text: "its fitness divided by the average fitness"
    explain: "Fixation means the type takes over the whole population."

  - q: "Under neutral drift (a mutant of the same fitness as residents), a single mutant fixes with probability ..."
    options:
      - text: "\\(1/N\\)"
        correct: true
      - text: "\\(1\\)"
      - text: "\\(0\\)"
      - text: "\\(1/2\\)"
    explain: "With no fitness difference, each of the \\(N\\) individuals is equally likely to be the ancestor."

  - q: "A Moran process with two types has ..."
    options:
      - text: "two absorbing states: all of one type or all of the other"
        correct: true
      - text: "no absorbing states"
      - text: "exactly one absorbing state"
      - text: "an absorbing state at every population split"
    explain: "Once a single type remains there is nothing to change, so those states absorb."

  - q: "For an advantageous mutant with relative fitness \\(r > 1\\), as \\(N \\to \\infty\\) the fixation probability tends to ..."
    options:
      - text: "\\(1 - 1/r\\), which is bounded away from 1"
        correct: true
      - text: "\\(1\\)"
      - text: "\\(0\\)"
      - text: "\\(1/N\\)"
    explain: "Even a beneficial mutant is often lost while still rare, so fixation is not certain."

  - q: "The relative fitness \\(r\\) of a mutant is ..."
    options:
      - text: "its fitness divided by the resident fitness"
        correct: true
      - text: "the number of mutants"
      - text: "the probability it dies"
      - text: "the size of the population"
    explain: "\\(r\\) compares the mutant's fitness to that of the residents."

  - q: "In a game-based Moran process, the fitness of an individual depends on ..."
    options:
      - text: "the composition of the whole population (its payoff in the current state)"
        correct: true
      - text: "only its own type"
      - text: "the round number"
      - text: "nothing; all fitnesses are equal"
    explain: "Fitness is computed from the game against the current population."

  - q: "Selection in the Moran process acts through ..."
    options:
      - text: "the birth step: fitter individuals are more likely to reproduce"
        correct: true
      - text: "the death step: fitter individuals are more likely to die"
      - text: "neither step"
      - text: "the population size"
    explain: "Reproduction is proportional to fitness; death is uniform."

  - q: "The death step of the Moran process chooses an individual ..."
    options:
      - text: "uniformly at random"
        correct: true
      - text: "proportional to fitness"
      - text: "with the lowest fitness"
      - text: "that just reproduced"
    explain: "Death is uniform, which keeps the population size fixed."

  - q: "The two-type fixation formula uses the ratios \\(\\gamma_i\\) defined as ..."
    options:
      - text: "\\(p_{i,i-1} / p_{i,i+1}\\), the down-step over up-step probabilities"
        correct: true
      - text: "the fitness of type 1"
      - text: "the population size"
      - text: "\\(1/N\\)"
    explain: "\\(\\gamma_i\\) compares the chance of losing versus gaining a mutant from state \\(i\\)."

  - q: "Under strong selection (\\(w = 1\\)) ..."
    options:
      - text: "fitness equals the raw payoff, so payoff differences act at full strength"
        correct: true
      - text: "all fitnesses are equal"
      - text: "the process never fixes"
      - text: "the population grows"
    explain: "With \\(w = 1\\) the payoff is the fitness directly."

  - q: "The boundary conditions for the fixation probability are ..."
    options:
      - text: "\\(\\rho_0 = 0\\) and \\(\\rho_N = 1\\)"
        correct: true
      - text: "\\(\\rho_0 = 1\\) and \\(\\rho_N = 0\\)"
      - text: "\\(\\rho_0 = \\rho_N = 1/2\\)"
      - text: "\\(\\rho_0 = \\rho_N = 1/N\\)"
    explain: "With no mutants fixation is impossible; with all mutants it is certain."

  - q: "A single mutant is favoured by selection when its fixation probability satisfies ..."
    options:
      - text: "\\(\\rho_1 > 1/N\\)"
        correct: true
      - text: "\\(\\rho_1 < 1/N\\)"
      - text: "\\(\\rho_1 = 0\\)"
      - text: "\\(\\rho_1 = 1\\)"
    explain: "Beating the neutral value \\(1/N\\) means selection helps the mutant spread."

  - q: "The Moran process is repeated until ..."
    options:
      - text: "only one type remains in the population"
        correct: true
      - text: "a fixed number of steps have passed"
      - text: "the population doubles"
      - text: "every individual has reproduced once"
    explain: "Absorption occurs when a single type takes over."

  - q: "A disadvantageous mutant (\\(r < 1\\)) has a fixation probability that is ..."
    options:
      - text: "below the neutral value \\(1/N\\)"
        correct: true
      - text: "above the neutral value \\(1/N\\)"
      - text: "exactly \\(1\\)"
      - text: "exactly \\(1/2\\)"
    explain: "Selection works against it, so it fixes less often than under drift."

  - q: "The two-type fixation probability is \\(\\rho_i = \\dfrac{1 + \\sum_{j=1}^{i-1}\\prod_{k=1}^{j}\\gamma_k}{1 + \\sum_{j=1}^{N-1}\\prod_{k=1}^{j}\\gamma_k}\\), where \\(\\gamma_k\\) equals ..."
    options:
      - text: "\\(f_R(k)/f_M(k)\\), the resident-to-mutant fitness ratio"
        correct: true
      - text: "\\(f_M(k)/f_R(k)\\)"
      - text: "\\(1/N\\)"
      - text: "the mutant fitness alone"
    explain: "The ratio \\(\\gamma_k = p_{k,k-1}/p_{k,k+1}\\) simplifies to \\(f_R(k)/f_M(k)\\)."

  - q: "In a constant-fitness process with mutant fitness \\(r\\) and resident fitness 1, the ratio \\(\\gamma_k\\) is ..."
    options:
      - text: "\\(r^{-1}\\) for every state \\(k\\)"
        correct: true
      - text: "\\(r\\) for every state \\(k\\)"
      - text: "different in every state"
      - text: "equal to \\(1/N\\)"
    explain: "Because fitness does not depend on the population composition, the ratio is the same in every state."

  - q: "Weak selection in the Moran process corresponds to a selection intensity \\(w\\) that is ..."
    options:
      - text: "close to 0"
        correct: true
      - text: "close to 1"
      - text: "negative"
      - text: "greater than \\(N\\)"
    explain: "Small \\(w\\) makes fitness differences slight, so dynamics are close to neutral drift; \\(w = 1\\) is strong selection."

  - q: "Throughout a Moran process the total population size ..."
    options:
      - text: "stays constant at \\(N\\), since each birth replaces a death"
        correct: true
      - text: "grows by one each step"
      - text: "shrinks over time"
      - text: "fluctuates randomly"
    explain: "One individual reproduces and one is removed at each step, keeping \\(N\\) fixed."

  - q: "Neutral drift is the special case of the Moran process in which the relative fitness is ..."
    options:
      - text: "\\(r = 1\\)"
        correct: true
      - text: "\\(r > 1\\)"
      - text: "\\(r < 1\\)"
      - text: "\\(r = 0\\)"
    explain: "With equal fitness a single mutant fixes with probability \\(1/N\\)."
