<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="shortcut icon" href="{{ baseurl }}/assets/favicon.ico">
  <link rel="stylesheet" href="{{ baseurl }}/assets/css/style.css?v={{ css_version }}">
  <script>
    MathJax = {
      tex: {
        inlineMath:  [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body>
  <header>
    <a class="logo" href="{{ baseurl }}/">{{ site_title }}</a>
    <nav>
      <ul>
        <li><a href="{{ baseurl }}/start-here/">Start here</a></li>
        <li><a href="{{ baseurl }}/">Schedule</a></li>
        <li><a href="{{ baseurl }}/assessment/">Assessment</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
  </header>

  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('theme-toggle');
        btn.textContent = (document.documentElement.getAttribute('data-theme') === 'light') ? '🌙' : '☀️';
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var next = current === 'light' ? 'dark' : 'light';
          if (next === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          btn.textContent = next === 'light' ? '🌙' : '☀️';
          localStorage.setItem('theme', next);
        });
      });
    })();
  </script>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script src="{{ baseurl }}/assets/js/quiz.js" defer></script>
</body>
</html>
