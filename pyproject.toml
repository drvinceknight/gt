[project]
name = "gt-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.7",
    "pymdown-extensions>=10.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
